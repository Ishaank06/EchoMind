spring.application.name=EchoMind

# ── Datasource ─────────────────────────────────────────────
# JDBC URL: protocol:vendor://host:port/database
# Port 5433 because your docker-compose maps 5433→5432
spring.datasource.url=jdbc:postgresql://localhost:5433/mydatabase
spring.datasource.username=myuser
spring.datasource.password=mypassword

# ── JPA / Hibernate ───────────────────────────────────────
# ddl-auto=update: Hibernate compares entities to the DB schema and
# adds missing tables/columns. It never drops anything.
# Good for development; Flyway replaces this in production.
spring.jpa.hibernate.ddl-auto=update

# show-sql: prints every SQL statement Hibernate executes to the console.
# Useful now for learning; turn off in production (noisy + slight overhead).
spring.jpa.show-sql=true

# format_sql: makes those SQL statements human-readable instead of single-line.
spring.jpa.properties.hibernate.format_sql=true

# ── Actuator ──────────────────────────────────────────────
# By default, only /actuator/health is exposed over HTTP.
# This explicitly includes health and info endpoints.
management.endpoints.web.exposure.include=health,info

# show-details=always: makes /actuator/health show component-level
# status (db, diskSpace, ping) instead of just {"status":"UP"}.
# In production, use "when-authorized" to restrict this behind auth.
management.endpoint.health.show-details=always

# ── JWT ───────────────────────────────────────────────────
# ${ENV_VAR:default} syntax: use environment variable if set, else use default.
# In Docker/production: set JWT_SECRET as an environment variable.
# In local dev: the default below is used (ONLY for development!).
# The secret MUST be at least 256 bits (32+ chars) for HMAC-SHA256.
app.jwt.secret=${JWT_SECRET:echomind-dev-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── GitHub OAuth2 ─────────────────────────────────────────
# OAuth2 config lives in application-oauth.properties (profile-based).
# Spring Boot 4.x validates that registered OAuth2 clients have non-empty
# client IDs at startup. Putting empty defaults here crashes the app.
#
# To enable GitHub OAuth:
# 1. Register an OAuth App at: https://github.com/settings/developers
#    Callback URL: http://localhost:8080/login/oauth2/code/github
# 2. Set environment variables: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
# 3. Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=oauth

